[package]
name = "ramtree"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Memory usage TUI: see which processes are using your RAM, and end them safely"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dmoore-dwmmholdings/ramtree"
readme = "README.md"
keywords = ["memory", "ram", "tui", "process", "top"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ratatui = "0.29"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[profile.release]
lto = true
